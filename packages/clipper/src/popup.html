<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>岁月史书 剪藏助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
      background: #fafaf9;
      color: #1c1917;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #0d9488;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .logo {
      font-family: serif;
      font-weight: bold;
      font-size: 16px;
      color: #115e59;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: #0d9488;
      color: #ffffff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: sans-serif;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      color: #78716c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    input, textarea, select {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #d6d3d1;
      border-radius: 4px;
      background: #ffffff;
      color: #1c1917;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.15);
    }
    .btn {
      width: 100%;
      background: #1c1917;
      color: #ffffff;
      font-weight: bold;
      font-size: 13px;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover { background: #292524; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
      text-align: center;
    }
    .status.success { background: #ccfbf1; color: #0f766e; display: block; }
    .status.error { background: #fee2e2; color: #991b1b; display: block; }
    .settings-toggle {
      font-size: 11px;
      color: #78716c;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 8px;
      text-align: right;
    }
    .settings-panel {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #d6d3d1;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>📖 岁月史书</span>
      <span class="badge">剪藏</span>
    </div>
  </div>

  <div class="form-group">
    <label for="title">事件标题</label>
    <input type="text" id="title" placeholder="正在获取标题..." />
  </div>

  <div class="form-group">
    <label for="tags">关联标签 (以逗号分隔)</label>
    <input type="text" id="tags" placeholder="例如: 科技, AI, 历史证据" value="剪藏" />
  </div>

  <div class="form-group">
    <label for="notes">修史批注 (可选)</label>
    <textarea id="notes" rows="2" placeholder="记录你当时的感想或争议焦点..."></textarea>
  </div>

  <div class="form-group" style="display:flex;align-items:center;gap:8px;">
    <input type="checkbox" id="autoConfirm" style="width:auto;" />
    <label for="autoConfirm" style="margin-bottom:0;cursor:pointer;">直接正式收录 (跳过草稿箱)</label>
  </div>

  <button id="clipBtn" class="btn">
    <span>⚡ 冻结证据并立案入库</span>
  </button>

  <div id="status" class="status"></div>

  <div class="settings-toggle" id="toggleSettings">⚙️ 服务端配置</div>

  <div class="settings-panel" id="settingsPanel">
    <div class="form-group">
      <label for="serverUrl">后端服务地址</label>
      <input type="text" id="serverUrl" value="http://localhost:3000" />
    </div>
    <div class="form-group">
      <label for="apiKey">API Key (可选)</label>
      <input type="password" id="apiKey" placeholder="输入 X-API-Key" />
    </div>
    <button id="saveSettingsBtn" class="btn" style="background:#44403c;padding:6px;font-size:12px;">保存配置</button>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
